<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA VI Global Countdown</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08060d;color:#fff;font-family:Arial, sans-serif}
body{background:radial-gradient(ellipse at 50% 40%,#281034 0,#100a18 55%,#07060b 100%)}
#wrap{width:100vw;height:100vh;position:relative;padding:2.2vh 2.8vw}
header{display:flex;justify-content:space-between;align-items:center}
.live{background:#e52d68;border-radius:5px;padding:7px 12px;font-size:clamp(9px,1.1vw,13px);font-weight:bold;letter-spacing:2px}
.brand{text-align:right;font-size:clamp(17px,2.2vw,28px);font-weight:1000;letter-spacing:3px;text-shadow:0 0 15px #dc62ff}
.brand small{display:block;font-size:8px;letter-spacing:2px;color:#b9a8c3}
h1{text-align:center;margin:1.4vh 0 .4vh;font-size:clamp(10px,1.3vw,16px);letter-spacing:2px;color:#e9dff0}
#hero{text-align:center;position:relative;z-index:2}
#place{font-size:clamp(10px,1.3vw,15px);font-weight:bold;letter-spacing:2px;color:#f05bff}
#timer{font-size:clamp(26px,4.4vw,52px);font-weight:1000;color:#ffe16a;text-shadow:0 0 20px #ffdb5b55}
#timer small{font-size:.35em;color:#eadfee}
#sub{font-size:clamp(7px,.85vw,10px);letter-spacing:1.5px;color:#a99caf}
.map{position:absolute;left:3%;right:3%;top:20%;height:46%;opacity:.95}
.map svg{width:100%;height:100%}.land{fill:#a333bd;stroke:#e36aff;stroke-width:1.5;stroke-opacity:.7}
.dot{fill:white;stroke:#f05bff;stroke-width:3;filter:drop-shadow(0 0 7px #f05bff)}
.cards{position:absolute;left:3%;right:3%;bottom:9%;height:27%;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(4,1fr);gap:6px}
.card{background:rgba(18,10,27,.92);border:1px solid #713c83;border-radius:6px;padding:6px;min-width:0;overflow:hidden}
.card.next{border-color:#ffe16a;box-shadow:0 0 12px #ffe16a35}
.n{font-size:clamp(6px,.78vw,10px);font-weight:bold;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eadcf0}
.c{font-size:clamp(11px,1.45vw,18px);font-weight:900;margin-top:5px;white-space:nowrap}
.c small{font-size:.48em;color:#bcaec6}
.city{font-size:clamp(6px,.65vw,8px);color:#9f91a9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{position:absolute;bottom:2.4%;left:3%;right:3%;display:flex;justify-content:space-between;color:#9f91a9;font-size:clamp(6px,.75vw,9px);letter-spacing:1px}
@media(max-aspect-ratio:1/1){.cards{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(7,1fr);height:47%;bottom:7%;}.map{top:22%;height:26%}#hero{margin-top:1vh}}
</style>
</head>
<body><main id="wrap">
<header><div class="live">● LIVE</div><div class="brand">GTA VI<small>GLOBAL COUNTDOWN</small></div></header>
<h1>GRAND THEFT AUTO VI · NOVEMBER 19, 2026</h1>
<section id="hero"><div id="place">GLOBAL RELEASE COUNTDOWN</div><div id="timer">--<small>h</small> --<small>m</small> --<small>s</small></div><div id="sub">REGIONAL LOCAL-TIME ESTIMATES · FAN-MADE COUNTDOWN</div></section>

</svg></div>
<section class="cards" id="cards"></section>

</main>
<script>
const release={y:2026,m:11,d:19};
const places=[
["NEW ZEALAND","Auckland","Pacific/Auckland"],["AUSTRALIA","Sydney","Australia/Sydney"],["JAPAN","Tokyo","Asia/Tokyo"],["SOUTH KOREA","Seoul","Asia/Seoul"],["CHINA","Shanghai","Asia/Shanghai"],["SINGAPORE","Singapore","Asia/Singapore"],["THAILAND","Bangkok","Asia/Bangkok"],["BANGLADESH","Dhaka","Asia/Dhaka"],["INDIA","New Delhi","Asia/Kolkata"],["PAKISTAN","Karachi","Asia/Karachi"],["UAE","Dubai","Asia/Dubai"],["SAUDI ARABIA","Riyadh","Asia/Riyadh"],["RUSSIA","Moscow","Europe/Moscow"],["SOUTH AFRICA","Johannesburg","Africa/Johannesburg"],["EGYPT","Cairo","Africa/Cairo"],["GERMANY","Berlin","Europe/Berlin"],["FRANCE","Paris","Europe/Paris"],["UK","London","Europe/London"],["BRAZIL","São Paulo","America/Sao_Paulo"],["ARGENTINA","Buenos Aires","America/Argentina/Buenos_Aires"],["USA EAST","New York","America/New_York"],["USA CENTRAL","Chicago","America/Chicago"],["USA MOUNTAIN","Denver","America/Denver"],["USA WEST","Los Angeles","America/Los_Angeles"],["CANADA WEST","Vancouver","America/Vancouver"],["MEXICO","Mexico City","America/Mexico_City"],["HAWAII","Honolulu","Pacific/Honolulu"]
];
function parts(date,tz){return Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(date).map(x=>[x.type,x.value]));}
function target(tz){let x=Date.UTC(release.y,release.m-1,release.d);for(let i=0;i<4;i++){let p=parts(new Date(x),tz);x+=Date.UTC(release.y,release.m-1,release.d)-Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);}return x;}
function fmt(ms){let s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;return `${d?d+"d ":""}${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;}
const ends=places.map(p=>target(p[2]));
const cards=document.getElementById("cards");
const els=places.map((p,i)=>{let e=document.createElement("article");e.className="card";e.innerHTML=`<div class="n">${p[0]}</div><div class="city">${p[1]}</div><div class="c">--:--:--</div>`;cards.appendChild(e);return e;});
function tick(){let now=Date.now(),next=Infinity,idx=-1;ends.forEach((t,i)=>{if(t>now&&t<next){next=t;idx=i;}els[i].querySelector(".c").textContent=now>=t?"UNLOCKED":fmt(t-now);els[i].classList.toggle("next",i===idx);});if(idx>=0){document.getElementById("place").textContent="NEXT UNLOCK · "+places[idx][0];document.getElementById("timer").innerHTML=fmt(next-now).replace(/d /,"d <small>").replace(/:/g,"</small> : <small>")+"</small>";}else{document.getElementById("place").textContent="GLOBAL RELEASE";document.getElementById("timer").textContent="UNLOCKED";}let p=parts(new Date(),"Asia/Karachi");document.getElementById("now").textContent=`PAKISTAN TIME ${p.hour}:${p.minute}:${p.second}`;}
tick();setInterval(tick,1000);
</script></body></html>
